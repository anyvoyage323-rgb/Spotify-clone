<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- left -->

    <div class="left margin">
      <!-- box1 -->
      <div class="box1 margin">
        <div class="logo">
          <img src="img/logo.svg" alt="LOGO" class="invert size" />
          <img src="img/close.svg" alt="" class="invert close" />
        </div>
        <div class="other">
          <ul>
            <li class="flex">
              <img src="img/home.svg" alt="HOME" class="invert size2" />Home
            </li>
            <li class="flex">
              <img
                src="img/search.svg"
                alt="SEARCH"
                class="invert size2"
              />Search
            </li>
          </ul>
        </div>
      </div>
      <!-- box2 -->
      <div class="box2 margin">
        <div class="play size3">
          <img src="img/playlist.svg" alt="PLAYLIST" class="invert size4" />Your
          Library
        </div>
        <div class="songs">
          <ul></ul>
        </div>
      </div>
    </div>
    <!-- right -->
    <div class="right margin">
      <nav>
        <div class="nav_left">
          <img src="img/hamburger.svg" alt="HAMBURGER" class="invert ham" />
          <img src="img/left.svg" alt="LEFT ARROW" />
          <img src="img/right.svg" alt="RIGHT ARROW" />
        </div>
        <div class="nav_right">
          <button class="btn1">Sign Up</button>
          <button class="btn2">Log In</button>
        </div>
      </nav>
      <div class="cards">
        <div class="card">
          <img src="img/cover.jpg" alt="COVER" class="size5" />
          <h2>Jazz for sleep</h2>
        </div>
        <div class="card">
          <img src="img/cover2.jpg" alt="COVER" class="size5" />
          <h2>Lofi sleep</h2>
        </div>
      </div>
      <div class="playbar">
        <div class="saman">
          <div class="songname"></div>
          <div class="saman1">
          <img src="img/prevsong.svg" alt="PREV SONG" class="size6 invert pointer prev"/>
          <img src="img/play.svg"  alt="PAUSE SONG" class="size6 invert pointer stop"/>
          <img src="img/nextsong.svg" alt="NEXT SONG" class="size6 invert pointer next"/>
            </div>
          <div class="songtime"></div>
            </div>
        <div class="seekbar">
          <div class="circle"></div>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
